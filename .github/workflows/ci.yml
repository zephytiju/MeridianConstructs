# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, conformance, and package evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Verify source, contracts, tests, and package
        run: |
          mkdir -p evidence
          npm run format:check
          npm run lint
          npm run typecheck
          npm run contracts:check
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=evidence/junit.xml
          npm run build
          npm run pack:check
          npm audit --audit-level=high
      - name: Build deterministic evidence bundle
        run: |
          npm pack --ignore-scripts --pack-destination evidence
          npm sbom --sbom-format spdx > evidence/meridian-storage-iac.spdx.json
          sha256sum evidence/*.tgz evidence/*.json > evidence/SHA256SUMS
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-evidence-node-24
          path: |
            coverage/cobertura-coverage.xml
            coverage/lcov.info
            evidence/
          if-no-files-found: error

  node-compatibility:
    name: Node.js ${{ matrix.node-version }} packaged consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Build package
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}"
      - name: Verify clean consumer import
        run: |
          mkdir "${RUNNER_TEMP}/consumer"
          cd "${RUNNER_TEMP}/consumer"
          npm init --yes
          npm install --ignore-scripts "${RUNNER_TEMP}/meridian-storage-iac-1.0.0.tgz"
          node --input-type=module -e 'import { catalogNames, version } from "meridian-storage-iac"; if (version !== "1.0.0" || catalogNames.join(",") !== "structured,object,cache,evidence,streaming") process.exit(1)'
