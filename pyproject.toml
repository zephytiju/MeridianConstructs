# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-constructs"
version = "0.1.0"
description = "Pulumi constructs for Meridian deployment-time engine placement and runtime configuration"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
keywords = ["iac", "meridian", "pulumi", "storage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["pulumi==3.259.0"]

[project.optional-dependencies]
test = [
  "bandit[toml]==1.9.4",
  "build==1.5.0",
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "twine==7.0.0",
]

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianConstructs#readme"
Issues = "https://github.com/zephytiju/MeridianConstructs/issues"
Repository = "https://github.com/zephytiju/MeridianConstructs"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_constructs"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["meridian_constructs"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_constructs"]
mypy_path = "src"
warn_unreachable = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
