# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact test environment
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify quality
        run: |
          mkdir -p evidence
          ruff format --check src tests
          ruff check src tests
          python -m mypy src
          pytest --junitxml=evidence/junit.xml --cov=meridian_constructs --cov-report=term-missing --cov-report=xml:evidence/coverage.xml
          bandit -c pyproject.toml -r src
          python -m pip_audit . --strict
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > evidence/SHA256SUMS
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-evidence-python-3.12
          path: |
            dist/
            evidence/
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check . pytest==9.1.1
      - name: Run smoke tests
        run: pytest tests/test_package.py

  released-contracts:
    name: Released package conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install released contract matrix
        run: python -m pip install --disable-pip-version-check -e '.[test,conformance]'
      - name: Verify package metadata without importing Adapters
        run: meridian-constructs-compatibility --verify-installed --json
      - name: Validate output through released Meridian Core
        run: pytest tests/integration/test_released_runtime.py
