# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      constructs_version:
        description: "Optional public npm version to consume in integration gates"
        type: string
        required: false

env:
  CONSTRUCTS_VERSION: ${{ inputs.constructs_version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  released-capabilities:
    name: Public Adapter contracts and Core round trips
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.0"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install packed or public Constructs and public Adapter artifacts
        run: |
          mkdir -p evidence
          npm ci --ignore-scripts
          npm run build
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}"
          if test -n "${CONSTRUCTS_VERSION}"; then
            test "${CONSTRUCTS_VERSION}" = "$(node -p "require('./package.json').version")"
            npm install --ignore-scripts --save-exact --prefix "${RUNNER_TEMP}/consumer" "@zephytiju/meridian-storage-constructs@${CONSTRUCTS_VERSION}"
          else
            npm install --ignore-scripts --prefix "${RUNNER_TEMP}/consumer" "${RUNNER_TEMP}/zephytiju-meridian-storage-constructs-1.5.1.tgz"
          fi
          npm ls --prefix "${RUNNER_TEMP}/consumer" --json > evidence/constructs-install.json
          python -m venv "${RUNNER_TEMP}/runtime"
          "${RUNNER_TEMP}/runtime/bin/python" -m pip install --report evidence/public-install.json -r tests/integration/released-capabilities/requirements.txt pytest==8.4.2 ruff==0.16.3
          "${RUNNER_TEMP}/runtime/bin/python" -m pip check
      - name: Compare every exported family and original sixteen cases with public Core
        env:
          CONSTRUCTS_MODULE: ${{ runner.temp }}/consumer/node_modules/@zephytiju/meridian-storage-constructs/dist/index.js
          MERIDIAN_ACCEPTANCE_EVIDENCE_DIR: evidence
        run: |
          "${RUNNER_TEMP}/runtime/bin/ruff" check tests/integration/released-capabilities
          "${RUNNER_TEMP}/runtime/bin/ruff" format --check tests/integration/released-capabilities
          "${RUNNER_TEMP}/runtime/bin/python" -m pytest tests/integration/released-capabilities -v --junitxml=evidence/released-capabilities.xml
          "${RUNNER_TEMP}/runtime/bin/python" tests/integration/released-capabilities/export_contracts.py evidence/selected-contracts.json
          "${RUNNER_TEMP}/runtime/bin/python" -m pip freeze > evidence/installed-python.txt
          sha256sum evidence/*.json > evidence/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-released-capabilities
          path: evidence/
          if-no-files-found: error

  metadata-config:
    name: Packaged metadata config PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "16"
            engine: "16-postgis-3.4"
            image: "postgis/postgis@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f"
          - pg: "17"
            engine: "17-postgis-3.5"
            image: "postgis/postgis@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install packed Constructs and public Python distributions
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}"
          if test -n "${CONSTRUCTS_VERSION}"; then
            test "${CONSTRUCTS_VERSION}" = "$(node -p "require('./package.json').version")"
            npm install --ignore-scripts --save-exact --prefix "${RUNNER_TEMP}/consumer" "@zephytiju/meridian-storage-constructs@${CONSTRUCTS_VERSION}"
          else
            npm install --ignore-scripts --prefix "${RUNNER_TEMP}/consumer" "${RUNNER_TEMP}/zephytiju-meridian-storage-constructs-1.5.1.tgz"
          fi
          mkdir -p evidence
          npm ls --prefix "${RUNNER_TEMP}/consumer" --json > evidence/constructs-install.json
          python -m venv "${RUNNER_TEMP}/runtime"
          "${RUNNER_TEMP}/runtime/bin/python" -m pip install --report evidence/public-install.json -r tests/integration/runtime-config/requirements.txt pytest==8.4.2 ruff==0.16.3
          "${RUNNER_TEMP}/runtime/bin/python" -m pip check
      - name: Verify generated configuration through public Core and PostgreSQL
        env:
          CONSTRUCTS_MODULE: ${{ runner.temp }}/consumer/node_modules/@zephytiju/meridian-storage-constructs/dist/index.js
          MERIDIAN_POSTGRESQL_TEST_DSN: "host=127.0.0.1 port=5432 dbname=meridian user=meridian password=meridian"
          MERIDIAN_POSTGRESQL_ENGINE_VERSION: ${{ matrix.engine }}
          MERIDIAN_ACCEPTANCE_EVIDENCE_DIR: evidence
          ENGINE_IMAGE: ${{ matrix.image }}
        run: |
          "${RUNNER_TEMP}/runtime/bin/ruff" check tests/integration/runtime-config
          "${RUNNER_TEMP}/runtime/bin/ruff" format --check tests/integration/runtime-config
          "${RUNNER_TEMP}/runtime/bin/python" -m pytest tests/integration/runtime-config -v --junitxml=evidence/metadata-config.xml
          "${RUNNER_TEMP}/runtime/bin/python" tests/integration/runtime-config/evidence.py
          docker image inspect "${ENGINE_IMAGE}" --format '{{json .RepoDigests}}' > evidence/engine-image-digests.json
          sha256sum "${RUNNER_TEMP}/zephytiju-meridian-storage-constructs-1.5.1.tgz" > evidence/constructs-package.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata-config-postgresql-${{ matrix.pg }}
          path: evidence/
          if-no-files-found: error

  projection-jobs:
    name: Packaged projection jobs PostgreSQL ${{ matrix.pg }} / Adapter ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adapter: ["2.1.0", "2.1.1", "2.2.0", "2.3.1"]
        pg: ["16", "17"]
        include:
          - adapter: "2.1.0"
            requirements: "src/jobs/projection/assets/requirements.txt"
          - adapter: "2.1.1"
            requirements: "src/jobs/projection/assets/requirements.txt"
          - adapter: "2.2.0"
            requirements: "tests/integration/jobs/requirements-repaired.txt"
          - adapter: "2.3.1"
            requirements: "tests/integration/runtime-config/requirements.txt"
          - pg: "16"
            engine: "16-postgis-3.4"
            image: "postgis/postgis@sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f"
          - pg: "17"
            engine: "17-postgis-3.5"
            image: "postgis/postgis@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install packaged host and public runtime artifacts
        run: |
          npm ci --ignore-scripts
          npm run build
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}"
          if test -n "${CONSTRUCTS_VERSION}"; then
            test "${CONSTRUCTS_VERSION}" = "$(node -p "require('./package.json').version")"
            npm install --ignore-scripts --save-exact --prefix "${RUNNER_TEMP}/consumer" "@zephytiju/meridian-storage-constructs@${CONSTRUCTS_VERSION}"
          else
            npm install --ignore-scripts --prefix "${RUNNER_TEMP}/consumer" "${RUNNER_TEMP}/zephytiju-meridian-storage-constructs-1.5.1.tgz"
          fi
          npm install --ignore-scripts --prefix "${RUNNER_TEMP}/legacy-consumer" @zephytiju/meridian-storage-constructs@1.1.0
          mkdir -p evidence
          npm ls --prefix "${RUNNER_TEMP}/consumer" --json > evidence/constructs-install.json
          python -m venv "${RUNNER_TEMP}/runtime"
          "${RUNNER_TEMP}/runtime/bin/python" -m pip install --report evidence/runtime-install.json -r "${{ matrix.requirements }}" pytest==8.4.2 ruff==0.16.3
          "${RUNNER_TEMP}/runtime/bin/python" -m pip install --report evidence/selected-adapter-install.json meridian-storage-postgresql==${{ matrix.adapter }}
          "${RUNNER_TEMP}/runtime/bin/python" -m pip check
      - name: Verify actual host processes and durable state
        env:
          CONSTRUCTS_MODULE: ${{ runner.temp }}/consumer/node_modules/@zephytiju/meridian-storage-constructs/dist/index.js
          LEGACY_CONSTRUCTS_MODULE: ${{ runner.temp }}/legacy-consumer/node_modules/@zephytiju/meridian-storage-constructs/dist/index.js
          MERIDIAN_POSTGRESQL_TEST_DSN: "host=127.0.0.1 port=5432 dbname=meridian user=meridian password=meridian"
          MERIDIAN_POSTGRESQL_ENGINE_VERSION: ${{ matrix.engine }}
          MERIDIAN_POSTGRESQL_PACKAGE_VERSION: ${{ matrix.adapter }}
          MERIDIAN_RUNTIME_REQUIREMENTS: ${{ matrix.requirements }}
          ENGINE_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p evidence
          "${RUNNER_TEMP}/runtime/bin/ruff" check src/jobs/projection/assets tests/integration/jobs
          "${RUNNER_TEMP}/runtime/bin/ruff" format --check src/jobs/projection/assets tests/integration/jobs
          "${RUNNER_TEMP}/runtime/bin/python" -m pytest tests/integration/jobs -v --junitxml=evidence/projection-jobs.xml
          "${RUNNER_TEMP}/runtime/bin/python" scripts/runtime-evidence.py
          docker image inspect "${ENGINE_IMAGE}" --format '{{json .RepoDigests}}' > evidence/engine-image-digests.json
          "${RUNNER_TEMP}/runtime/bin/python" -m pip freeze > evidence/released-runtime.txt
          sha256sum "${RUNNER_TEMP}/zephytiju-meridian-storage-constructs-1.5.1.tgz" > evidence/projection-package.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: projection-jobs-postgresql-${{ matrix.pg }}-adapter-${{ matrix.adapter }}
          path: evidence/
          if-no-files-found: error

  quality:
    name: Quality, conformance, and package evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Verify source, contracts, tests, and package
        run: |
          mkdir -p evidence
          npm run format:check
          npm run lint
          npm run typecheck
          npm run contracts:check
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=evidence/junit.xml
          npm run build
          npm run pack:check
          npm audit --audit-level=high
      - name: Build deterministic evidence bundle
        run: |
          npm pack --ignore-scripts --pack-destination evidence
          npm sbom --sbom-format spdx > evidence/zephytiju-meridian-storage-constructs.spdx.json
          sha256sum evidence/*.tgz evidence/*.json > evidence/SHA256SUMS
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-evidence-node-24
          path: |
            coverage/cobertura-coverage.xml
            coverage/lcov.info
            evidence/
          if-no-files-found: error

  node-compatibility:
    name: Node.js ${{ matrix.node-version }} packaged consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Build package
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}"
      - name: Verify clean consumer import
        run: |
          mkdir "${RUNNER_TEMP}/consumer"
          cd "${RUNNER_TEMP}/consumer"
          npm init --yes
          npm install --ignore-scripts "${RUNNER_TEMP}/zephytiju-meridian-storage-constructs-1.5.1.tgz"
          node --input-type=module -e 'import { catalogNames, version } from "@zephytiju/meridian-storage-constructs"; if (version !== "1.5.1" || catalogNames.join(",") !== "structured,object,cache,evidence,streaming") process.exit(1)'
