# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify, and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify immutable tag identity
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Run release gate
        run: |
          npm run check
          npm audit --audit-level=high
      - name: Build release artifacts
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          npm sbom --sbom-format spdx > release/zephytiju-meridian-storage-constructs.spdx.json
          sha256sum release/*.tgz release/*.json > release/SHA256SUMS
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-distribution
          path: release/
          if-no-files-found: error
      - name: Attest npm tarball and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.spdx.json

  npm:
    name: Publish npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@zephytiju/meridian-storage-constructs
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-distribution
          path: release/
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          registry-url: https://registry.npmjs.org
      - name: Publish with npm trusted publishing and provenance
        env:
          PACKAGE_NAME: "@zephytiju/meridian-storage-constructs"
        run: |
          set -euo pipefail
          mapfile -t package_tarballs < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#package_tarballs[@]}" -eq 1
          package_tarball="${package_tarballs[0]}"
          package_version="${GITHUB_REF_NAME#v}"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "${package_tarball}" | openssl base64 -A)"

          if registry_integrity="$(npm view "${PACKAGE_NAME}@${package_version}" dist.integrity --json 2>/dev/null)"; then
            registry_integrity="${registry_integrity%\"}"
            registry_integrity="${registry_integrity#\"}"
            test "${registry_integrity}" = "${local_integrity}"
            echo "${PACKAGE_NAME}@${package_version} is already public with matching integrity"
          else
            npm publish "${package_tarball}" --access public --provenance
          fi
      - name: Verify public registry receipt
        run: npm view "@zephytiju/meridian-storage-constructs@${GITHUB_REF_NAME#v}" version --json

  github-release:
    name: Publish GitHub release
    needs: [build, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-distribution
          path: release/
      - name: Create immutable release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
